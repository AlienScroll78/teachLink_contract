name: Regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── 1. Unit + Integration Tests ───────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --workspace --lib 2>&1 | tee test-unit.txt

      - name: Integration tests
        run: cargo test --workspace --test '*' 2>&1 | tee test-integration.txt

      - name: Detect test failures
        run: |
          grep -qE "^test result: FAILED" test-unit.txt test-integration.txt \
            && echo "::error::Test failures detected" && exit 1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            test-unit.txt
            test-integration.txt
          retention-days: 14

  # ── 2. WASM Size Gate ─────────────────────────────────────────────────────
  wasm-size:
    name: WASM Size Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Build WASM
        run: cargo build --target wasm32v1-none --release

      - name: Check size ≤ 300 KB
        run: |
          WASM=$(find target/wasm32v1-none/release -name '*.wasm' | head -1)
          SIZE=$(stat -c%s "$WASM")
          echo "$SIZE" > wasm_size.txt
          echo "WASM size: $SIZE bytes"
          [ "$SIZE" -le 307200 ] || \
            (echo "::error::WASM $SIZE bytes exceeds 300 KB limit" && exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: wasm_size.txt
          retention-days: 14

  # ── 3. Gas Performance Baseline ───────────────────────────────────────────
  gas-baseline:
    name: Gas Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run gas benchmarks
        run: |
          cargo test --release -p teachlink-contract --test test_gas_benchmarks \
            -- --nocapture 2>&1 | tee gas_benchmark_output.txt || true

      - name: Extract gas metrics
        run: |
          python3 scripts/run_gas_benchmarks.py --output gas_current.json || true

      - name: Check against baseline
        run: python3 scripts/check_performance_baseline.py --current gas_current.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gas-results
          path: |
            gas_current.json
            gas_benchmark_output.txt
          retention-days: 30

  # ── 4. Generate Report ────────────────────────────────────────────────────
  report:
    name: Generate Report
    runs-on: ubuntu-latest
    needs: [tests, wasm-size, gas-baseline]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts

      - name: Generate regression report
        run: python3 scripts/generate_regression_report.py

      - name: Post to job summary
        run: cat testing/reports/regression_report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            testing/reports/regression_report.json
            testing/reports/regression_report.md
          retention-days: 30
